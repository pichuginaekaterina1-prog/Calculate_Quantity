<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey Cross-tab</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .flex { display: flex; gap: 12px; align-items:center; flex-wrap:wrap; }
    textarea { width:100%; min-height:160px; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    td, th { border: 1px solid #888; padding: 6px 10px; }
  </style>
</head>
<body>
  <h1>Survey Cross-tab MVP</h1>

  <section>
    <h2>1) Загрузить Excel</h2>
    <input id="file" type="file" accept=".xlsx" />
    <button id="upload">Загрузить</button>
    <div id="uploadStatus"></div>
  </section>

  <section>
    <h2>2) Выбрать вопросы</h2>
    <div class="flex">
      <label>Row:
        <select id="rowQuestion"></select>
      </label>
      <label>Col:
        <select id="colQuestion"></select>
      </label>
      <label><input type="checkbox" id="scale5" /> 5-балльная топ2/боттом2</label>
      <button id="build">Считать кросс-таб</button>
    </div>
    <div id="crosstabInfo"></div>
    <div id="result"></div>
  </section>

  <script>
    const apiUrl = "http://127.0.0.1:8000";
    let questions=[];

    async function fetchQuestions() {
      const r=await fetch(`${apiUrl}/questions`);
      if(!r.ok) throw new Error('No data uploaded');
      const j=await r.json();
      questions=j.questions;
      const row=document.getElementById('rowQuestion');
      const col=document.getElementById('colQuestion');
      row.innerHTML=''; col.innerHTML='';
      questions.forEach(q=>{row.innerHTML+=`<option value="${q}">${q}</option>`; col.innerHTML+=`<option value="${q}">${q}</option>`;});
    }

    document.getElementById('upload').addEventListener('click', async ()=>{
      const fileInput=document.getElementById('file');
      if(!fileInput.files.length){ alert('Выберите файл'); return; }
      const form=new FormData(); form.append('file', fileInput.files[0]);
      const status=document.getElementById('uploadStatus');
      status.textContent='Загрузка...';
      try {
        const r=await fetch(`${apiUrl}/upload`, { method:'POST', body:form });
        if(!r.ok){const err=await r.json(); throw new Error(err.detail||r.statusText);}        
        const j=await r.json();
        status.textContent=`Загружено ${j.rows} строк, ${j.columns.length} столбцов.`;
        await fetchQuestions();
      } catch(e){ status.textContent=`Ошибка: ${e.message}`; }
    });

    document.getElementById('build').addEventListener('click', async ()=>{
      const rowQuestion=document.getElementById('rowQuestion').value;
      const colQuestion=document.getElementById('colQuestion').value;
      const scale5=document.getElementById('scale5').checked;
      if (!rowQuestion || !colQuestion){ alert('Выберите вопросы.'); return; }

      const payload={ row_question: rowQuestion, col_question: colQuestion, scale5 };
      const r=await fetch(`${apiUrl}/crosstab`, {
        method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload),
      });
      if(!r.ok){const err=await r.json(); alert('Ошибка: '+(err.detail||r.statusText)); return; }

      const data=await r.json();
      const info=document.getElementById('crosstabInfo');
      info.innerHTML=`<strong>Respondents по row:</strong> ${data.row_respondents}, <strong>по col:</strong> ${data.col_respondents}`;

      let html='<table><thead><tr><th>Row \ Col</th>';
      const cols=Object.keys(data.crosstab[colQuestion]||{});
      cols.forEach(c=>{html+=`<th>${c}</th>`;});
      html+='<th>Всего</th></tr></thead><tbody>';

      for (const rowValue of Object.keys(data.crosstab)) {
        let rowTotal=0; html += `<tr><td>${rowValue}</td>`;
        cols.forEach(c=>{const v = data.crosstab[rowValue]?.[c]||0; rowTotal += v; html += `<td>${v} (${(data.percent[rowValue]?.[c]||0).toFixed(2)}%)</td>`;});
        html += `<td>${rowTotal}</td></tr>`;
      }
      html += '</tbody></table>';

      if(data.scale5){
        html += `<h3>5-балльная агрегация</h3>`;
        html += `<p><strong>${data.row_question}:</strong> ${data.scale5.row_question.top2_percent}% top2, ${data.scale5.row_question.bottom2_percent}% bottom2, n=${data.scale5.row_question.total_respondents}</p>`;
        html += `<p><strong>${data.col_question}:</strong> ${data.scale5.col_question.top2_percent}% top2, ${data.scale5.col_question.bottom2_percent}% bottom2, n=${data.scale5.col_question.total_respondents}</p>`;
      }

      document.getElementById('result').innerHTML=html;
    });

  </script>
</body>
</html>
